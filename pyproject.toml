[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dci-pilot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "PyYAML>=6.0", "matplotlib>=3.8", "scipy>=1.11"]

[project.scripts]
dci-train = "dci_pilot.train:main"
dci-detailed-report = "dci_pilot.detailed_report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
